appId: com.numbersober.app
productName: Number Sober
directories:
  output: release
files:
  - .next/**
  - node_modules/**
  - electron/**
  - package.json
  - next.config.*
  - public/**
asarUnpack:
  - node_modules/better-sqlite3/**
  # next CLI 必须在真实文件系统上(asar 内无法 spawn)
  - node_modules/next/dist/bin/**
  - node_modules/next/dist/bin/next
npmRebuild: false
mac:
  target:
    - dmg
  category: public.app-category.finance
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  title: ${productName} 明算
